[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typst_pyexec"
version = "0.1.1"
description = "Reactive Python execution engine for Typst documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "typst_pyexec contributors" }]
keywords = ["typst", "jupyter", "reactive", "notebook", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "jupyter-client>=8.0",
    "nbformat>=5.9",
    "watchdog>=3.0",
    "joblib>=1.3",
    "black>=24.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.1",
    "pytest-cov>=5.0",
    "ruff",
    "mypy",
]

[project.scripts]
typst_pyexec = "typst_pyexec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["typst_pyexec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
